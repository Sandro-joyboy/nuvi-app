<svg width="105" height="90" viewBox="0 0 105 90" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<path id="chat-back" d="M72 1C89.67 1 104 14.88 104 32C104 39.28 101.41 45.98 97.07 51.28L101 63L87.62 58.62C83.03 61.4 77.69 63 72 63C54.33 63 40 49.12 40 32C40 14.88 54.33 1 72 1Z"/>
<path id="chat-front" d="M42 8C64.64 8 83 25.46 83 47C83 68.54 64.64 86 42 86C35.4 86 29.17 84.52 23.66 81.88L5 88L10.57 71.48C5.8 64.59 3 56.12 3 47C3 25.46 21.36 8 42 8Z"/>
<clipPath id="chat-clip"><use href="#chat-front"/></clipPath>
<linearGradient id="chat-back-fill" x1="50" y1="4" x2="98" y2="62" gradientUnits="userSpaceOnUse">
<stop stop-color="#A4D0FE"/>
<stop offset="1" stop-color="#037BFC"/>
</linearGradient>
<linearGradient id="chat-rim" x1="12" y1="14" x2="70" y2="84" gradientUnits="userSpaceOnUse">
<stop stop-color="white" stop-opacity="0.9"/>
<stop offset="0.45" stop-color="white" stop-opacity="0.15"/>
<stop offset="1" stop-color="white" stop-opacity="0.5"/>
</linearGradient>
<radialGradient id="chat-sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(26 18) rotate(50) scale(62 58)">
<stop stop-color="white" stop-opacity="0.55"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</radialGradient>
<filter id="chat-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="chat-dot-shadow" x="0" y="20" width="90" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feOffset dx="2" dy="3"/>
<feGaussianBlur stdDeviation="3"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.243 0 0 0 0 0.627 0 0 0 0 0.996 0 0 0 0.6 0"/>
<feBlend in="SourceGraphic"/>
</filter>
</defs>
<!-- Balão de trás: azul Nuvi sólido -->
<use href="#chat-back" fill="url(#chat-back-fill)"/>
<!-- Balão da frente: vidro (o de trás desfocado visto através dele) -->
<g clip-path="url(#chat-clip)">
<use href="#chat-front" fill="#D6EBFF" fill-opacity="0.55"/>
<use href="#chat-back" fill="url(#chat-back-fill)" filter="url(#chat-blur)" opacity="0.85"/>
<use href="#chat-front" fill="url(#chat-sheen)"/>
<use href="#chat-front" stroke="url(#chat-rim)" stroke-width="3"/>
</g>
<!-- Pontos -->
<g filter="url(#chat-dot-shadow)" fill="white">
<circle cx="25" cy="47" r="5"/>
<circle cx="42" cy="47" r="5"/>
<circle cx="59" cy="47" r="5"/>
</g>
</svg>
